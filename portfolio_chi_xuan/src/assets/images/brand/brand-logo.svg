<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#281C21" />
      <stop offset="100%" stop-color="#181215" />
    </linearGradient>
    <linearGradient id="hexGrad" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E06C82" />
      <stop offset="100%" stop-color="#8D4D58" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle outer ring -->
  <circle cx="32" cy="34" r="22" stroke="#E06C82" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2.5 2.5" />

  <!-- Top antenna signal -->
  <path d="M28 9.5C30.2 7.5 33.8 7.5 36 9.5" stroke="#E06C82" stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
  <circle cx="32" cy="12" r="2.2" fill="#E06C82" />
  <line x1="32" y1="14" x2="32" y2="17" stroke="#E06C82" stroke-width="1.5" />

  <!-- Outer hexagon -->
  <polygon
    points="32,16.5 47,25 47,42 32,50.5 17,42 17,25"
    stroke="url(#hexGrad)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />

  <!-- Side sensor pods -->
  <rect x="13" y="31" width="3.5" height="6" rx="1.5" fill="#E06C82" />
  <rect x="47.5" y="31" width="3.5" height="6" rx="1.5" fill="#E06C82" />

  <!-- Inner hexagon -->
  <polygon
    points="32,20.5 43.5,27 43.5,40 32,46.5 20.5,40 20.5,27"
    fill="#1B1317"
    stroke="#E06C82"
    stroke-opacity="0.6"
    stroke-width="1.2"
  />

  <!-- STEM orbital arcs -->
  <ellipse cx="32" cy="34" rx="9" ry="4" transform="rotate(-24 32 34)" stroke="#16A085" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.85" />
  <ellipse cx="32" cy="34" rx="9" ry="4" transform="rotate(24 32 34)" stroke="#E06C82" stroke-width="1.1" stroke-dasharray="2 2" opacity="0.65" />

  <!-- Robot visor -->
  <rect x="22" y="29.5" width="20" height="8" rx="4" fill="#120C0F" stroke="#E06C82" stroke-width="1.5" />
  <circle cx="27.5" cy="33.5" r="2.2" fill="#FFFFFF" />
  <circle cx="27.5" cy="33.5" r="3.4" stroke="#E06C82" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="36.5" cy="33.5" r="2.2" fill="#FFFFFF" />
  <circle cx="36.5" cy="33.5" r="3.4" stroke="#E06C82" stroke-opacity="0.45" stroke-width="1" />

  <!-- Smile / status arc -->
  <path d="M28.5 41.2C30.6 42.6 33.4 42.6 35.5 41.2" stroke="#E06C82" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="32" cy="42.2" r="1.1" fill="#16A085" />
</svg>
